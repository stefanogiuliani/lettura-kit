[project]
name = "lettura-kit"
version = "0.2.0"
description = "Apertura sicura di file tabellari che arrivano da fuori: le guardie, non il dominio."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lettura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
